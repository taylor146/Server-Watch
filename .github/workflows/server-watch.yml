name: Server Watch

on:
  # Triggered every 5 min by cron-job.org (more reliable than GitHub's own timer).
  # To go back to GitHub's timer, add:  schedule: [{cron: "2-59/5 * * * *"}]
  workflow_dispatch:            # "Run workflow" button for manual checks
    inputs:
      test_slack:
        description: "Only send a test message to Slack (no server checks)"
        type: boolean
        default: false
      intro:
        description: "Only post the bot's introduction message to Slack"
        type: boolean
        default: false

permissions:
  contents: write               # to save state.json between runs

concurrency:
  group: server-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check game servers
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MENTION: ${{ vars.SLACK_MENTION }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python monitor.py ${{ inputs.intro && '--intro' || '' }} ${{ inputs.test_slack && '--test-slack' || '' }}

      - name: Save state
        if: always()
        run: |
          git config user.name  "server-watch-bot"
          git config user.email "server-watch-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state update [skip ci]"
            git pull --rebase -X theirs || true
            git push
          fi
